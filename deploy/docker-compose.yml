services:
  app:
    # 构建上下文为仓库根目录（Dockerfile 与 package.json 均在根目录，compose 文件在 deploy/ 下）。
    build: ..
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://union:${DB_PASSWORD:-union}@db:5432/union
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=files
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - SESSION_SECRET=${SESSION_SECRET:-please-change-me}
    depends_on:
      - db
      - minio
    networks: [internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=union
      - POSTGRES_USER=union
      - POSTGRES_PASSWORD=${DB_PASSWORD:-union}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [app]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
